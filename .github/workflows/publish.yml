name: Publish

on:
    push:
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest

        env:
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24.19.0"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run TypeScript check
              run: npm run typecheck

            - name: Check formatting
              run: npm run format:check

            - name: Build the fixture site
              run: npm run build:fixture

            - name: Verify the tag matches package.json
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  version="$(npm pkg get version | tr -d '"')"
                  if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
                      echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
                      exit 1
                  fi

            - name: Authenticate for the bootstrap publish
              if: env.NPM_TOKEN != ''
              run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc

            - name: Publish to npm
              run: |
                  version="$(npm pkg get version | tr -d '"')"
                  if [ -n "$(npm view "@nefantaris/core@${version}" version 2>/dev/null || true)" ]; then
                      echo "@nefantaris/core@${version} is already published — nothing to do."
                      exit 0
                  fi
                  npm publish --access public --provenance
